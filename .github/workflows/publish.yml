name: Publish episode

on:
  schedule:
    # 13:40 UTC Mon / Wed / Fri — off the top of the hour, where runners queue
    - cron: "40 13 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything but skip the upload"
        type: boolean
        default: false
      reset:
        description: "Discard in-progress episode state first"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Register brand fonts
        run: |
          mkdir -p ~/.fonts
          cp assets/fonts/*.ttf ~/.fonts/
          fc-cache -f

      # Kokoro weights are ~350 MB — cache them or every run re-downloads
      - name: Cache Kokoro model
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Fetch Kokoro model
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: python -m src.tts --fetch

      # work/ carries partial progress between a timed-out run and its retry
      - name: Restore work directory
        uses: actions/cache@v4
        with:
          path: work
          key: work-${{ github.run_id }}
          restore-keys: work-

      - name: Reset state
        if: inputs.reset
        run: python main.py --reset

      - name: Build and publish
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Commit state and topic queue
        if: always()
        run: |
          git config user.name  "sfm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json config/topics.yaml
          git diff --staged --quiet || git commit -m "chore: episode state $(date -u +%F)"
          git push || echo "nothing to push"

      - name: Upload artifacts on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          retention-days: 5
          path: |
            state.json
            work/narration.txt
            work/source_context.txt
            output/
