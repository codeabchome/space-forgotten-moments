# kind: single       -> rich enough archive to carry a full 8-10 min episode
# kind: piece        -> 1-4 min of material; 3-4 of these merge into one themed episode
# theme:             -> pieces sharing a theme get compiled together
# query:             -> images.nasa.gov search terms (first match wins, rest broaden)
# status: pending | used | skipped

topics:
  # ---------------------------------------------------------------- singles
  - id: sk-1
    kind: single
    title: "Skylab's Forgotten Fire"
    angle: "The 1973 launch that tore off a micrometeoroid shield and nearly ended America's first space station before anyone lived in it."
    query: ["Skylab", "Skylab workshop", "Skylab 1973", "Skylab repair EVA"]
    status: pending

  - id: sk-2
    kind: single
    title: "Ranger: Nine Tries to Photograph the Moon"
    angle: "Six straight failures before Ranger 7 returned the first close-up lunar images in 1964."
    query: ["Ranger spacecraft", "Ranger lunar program", "Ranger 7", "Ranger Moon photographs"]
    status: pending

  - id: sk-3
    kind: single
    title: "The Lifting Bodies That Built the Shuttle"
    angle: "Wingless aircraft dropped from a B-52 over the Mojave to prove a spacecraft could land on a runway."
    query: ["lifting body aircraft", "lifting body research", "M2-F2", "HL-10", "X-24"]
    status: pending

  - id: sk-4
    kind: single
    title: "Pioneer 10: The First Object Leaving the Solar System"
    angle: "A probe built for 21 months that kept transmitting for 30 years, then went silent past the edge of the planets."
    query: ["Pioneer 10", "Pioneer spacecraft", "Pioneer Jupiter", "Pioneer plaque"]
    status: pending

  - id: sk-5
    kind: single
    title: "Gemini's Angry Spacecraft"
    angle: "Gemini 8 achieved the first docking in orbit, then began spinning once per second with two men aboard."
    query: ["Gemini 8", "Gemini spacecraft", "Gemini Agena docking", "Gemini program"]
    status: pending

